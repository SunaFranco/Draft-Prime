<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Battle Arena PVE — Draft Prime</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.95);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --hp-green: #22c55e;
      --hp-yellow: #eab308;
      --hp-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header superior móvil */
    .battle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }

    .battle-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #93c5fd;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .turn-badge {
      background: #3b82f6;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* Contenedor principal de la batalla (Mobile First) */
    .battle-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 540px;
      width: 100%;
      margin: 0 auto;
      padding: 8px;
      gap: 8px;
      box-sizing: border-box;
    }

    /* Escenario de combate */
    .battle-arena {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.5);
    }

    /* Zonas de combate (Rival y Jugador) */
    .side-zone {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .side-zone.ai-side {
      flex-direction: row-reverse;
    }

    .poke-info-card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 10px;
      flex: 1;
      min-width: 0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .poke-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 2px;
    }

    .poke-name {
      font-weight: 800;
      font-size: 0.88rem;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .poke-level {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
      flex-shrink: 0;
    }

    .type-tags {
      display: flex;
      gap: 3px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .type-badge {
      font-size: 0.6rem;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 800;
      text-transform: uppercase;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    .hp-bar-outer {
      background: rgba(0, 0, 0, 0.5);
      height: 7px;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hp-bar-inner {
      height: 100%;
      width: 100%;
      background: var(--hp-green);
      transition: width 0.7s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.45s ease;
      border-radius: 4px;
    }

    .hp-text {
      font-size: 0.68rem;
      font-weight: 700;
      text-align: right;
      margin-top: 2px;
      color: var(--text-muted);
    }

    .status-badge {
      display: inline-block;
      font-size: 0.62rem;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 800;
      margin-left: 4px;
    }
    .status-BRN { background: #ea580c; color: white; }
    .status-PAR { background: #ca8a04; color: white; }
    .status-PSN { background: #9333ea; color: white; }
    .status-TOX { background: #581c87; color: #f3e8ff; border: 1px solid #c084fc; }
    .status-SLP { background: #64748b; color: white; }
    .status-FRZ { background: #06b6d4; color: white; }

    /* Indicadores de Campo, Hazards y Etapas (Estilo Showdown) */
    .field-badges-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 4px 8px;
    }
    .field-pill {
      font-size: 0.64rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.25);
      border: 1px solid rgba(147, 197, 253, 0.45);
      color: #dbeafe;
    }
    .field-pill.neutral {
      background: rgba(148, 163, 184, 0.12);
      border-color: rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
      font-weight: 700;
    }
    .poke-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 3px;
      font-size: 0.6rem;
      color: #cbd5e1;
    }
    .meta-tag {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 700;
    }
    .ability-desc-line {
      width: 100%;
      font-size: 0.6rem;
      line-height: 1.2;
      color: #93c5fd;
      margin-top: 2px;
      font-weight: 600;
    }
    .move-flavor-desc {
      font-size: 0.6rem;
      line-height: 1.2;
      color: rgba(255, 255, 255, 0.88);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      margin: 1px 0;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
    }
    .modifiers-row {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 3px;
    }
    .modifiers-row:empty {
      display: none;
    }
    .mod-pill {
      font-size: 0.58rem;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 3px;
      line-height: 1.2;
    }
    .mod-pill.boost-up {
      background: rgba(34, 197, 94, 0.25);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.55);
      animation: modPop 0.3s ease-out;
    }
    .mod-pill.boost-down {
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.55);
      animation: modPop 0.3s ease-out;
    }
    @keyframes modPop {
      0% { transform: scale(0.75); opacity: 0.4; }
      60% { transform: scale(1.12); }
      100% { transform: scale(1); opacity: 1; }
    }
    .mod-pill.volatile { background: rgba(168, 85, 247, 0.25); color: #e9d5ff; border: 1px solid rgba(168, 85, 247, 0.45); }
    .mod-pill.hazard { background: rgba(245, 158, 11, 0.22); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.45); }
    .mod-pill.screen { background: rgba(6, 182, 212, 0.22); color: #a5f3fc; border: 1px solid rgba(6, 182, 212, 0.45); }

    .move-effect-desc {
      font-size: 0.64rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(0, 0, 0, 0.28);
      padding: 2px 5px;
      border-radius: 4px;
      margin: 3px 0;
      display: inline-block;
      width: fit-content;
    }

    .battle-log-details {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      margin-top: 2px;
    }
    .battle-log-summary {
      padding: 5px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #94a3b8;
      cursor: pointer;
      user-select: none;
      background: rgba(255, 255, 255, 0.03);
    }
    .battle-log-panel {
      background: transparent;
      padding: 6px 8px;
      max-height: 110px;
      overflow-y: auto;
      font-size: 0.7rem;
      line-height: 1.4;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .log-turn-header {
      color: #60a5fa;
      font-weight: 800;
      margin-top: 4px;
      border-bottom: 1px solid rgba(96, 165, 250, 0.2);
      padding-bottom: 2px;
    }
    .log-entry {
      padding-left: 4px;
    }
    .log-entry.dmg { color: #fca5a5; }
    .log-entry.heal { color: #86efac; }
    .log-entry.boost { color: #fde047; }
    .log-entry.field { color: #93c5fd; }

    /* Barra de Equipos 6v6 con Minisprites (debajo de los movimientos) - 100% Mobile First */
    .teams-overview-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 6px 8px;
      width: 100%;
      box-sizing: border-box;
    }

    .team-minis-side {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }

    .team-minis-side.ai-team-minis {
      align-items: flex-end;
    }

    .team-minis-label {
      font-size: 0.6rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .team-minis-row {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-wrap: nowrap;
    }

    .team-mini-slot {
      width: 25px;
      height: 25px;
      border-radius: 6px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      transition: transform 0.2s ease, border-color 0.2s ease, filter 0.25s ease;
    }

    .team-mini-slot.active-slot {
      border-color: #3b82f6;
      box-shadow: 0 0 6px rgba(59, 130, 246, 0.6);
      background: rgba(59, 130, 246, 0.2);
    }

    .team-mini-slot.fainted {
      filter: grayscale(100%) brightness(0.45);
      opacity: 0.45;
      border-color: rgba(255, 255, 255, 0.05);
      box-shadow: none;
    }

    .team-mini-img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .team-mini-img.pokeball-unrevealed {
      width: 15px;
      height: 15px;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
    }

    .team-minis-divider {
      font-size: 0.64rem;
      font-weight: 900;
      color: #64748b;
      padding: 0 4px;
      user-select: none;
      flex-shrink: 0;
    }

    /* Sprites y Animaciones de Cambio / Estadísticas */
    .sprite-container {
      width: 74px;
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .poke-sprite {
      width: 100%;
      height: 100%;
      max-width: 70px;
      max-height: 70px;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
      transition: transform 0.2s ease, filter 0.2s ease, opacity 0.2s ease;
    }

    .poke-sprite.shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    .poke-sprite.switch-out-player {
      animation: switchOutPlayer 0.42s ease-in forwards;
    }

    .poke-sprite.switch-out-ai {
      animation: switchOutAi 0.42s ease-in forwards;
    }

    .poke-sprite.switch-in-player {
      animation: switchInPlayer 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .poke-sprite.switch-in-ai {
      animation: switchInAi 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .poke-sprite.boost-glow {
      animation: boostGlow 0.55s ease-out;
    }

    .poke-sprite.unboost-glow {
      animation: unboostGlow 0.55s ease-out;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }

    @keyframes switchOutPlayer {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 1; filter: brightness(1); }
      40% { filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5); }
      100% { transform: translate3d(-45px, 18px, 0) scale(0.15); opacity: 0; filter: brightness(2.5) sepia(1) hue-rotate(-50deg) saturate(6); }
    }

    @keyframes switchOutAi {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 1; filter: brightness(1); }
      40% { filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5); }
      100% { transform: translate3d(45px, -18px, 0) scale(0.15); opacity: 0; filter: brightness(2.5) sepia(1) hue-rotate(-50deg) saturate(6); }
    }

    @keyframes switchInPlayer {
      0% { transform: translate3d(-40px, 15px, 0) scale(0.15); opacity: 0; filter: brightness(2.8); }
      65% { transform: translate3d(4px, -3px, 0) scale(1.08); opacity: 1; filter: brightness(1.4); }
      100% { transform: translate3d(0, 0, 0) scale(1); opacity: 1; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4)); }
    }

    @keyframes switchInAi {
      0% { transform: translate3d(40px, -15px, 0) scale(0.15); opacity: 0; filter: brightness(2.8); }
      65% { transform: translate3d(-4px, 3px, 0) scale(1.08); opacity: 1; filter: brightness(1.4); }
      100% { transform: translate3d(0, 0, 0) scale(1); opacity: 1; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4)); }
    }

    @keyframes boostGlow {
      0% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 0px #22c55e); }
      50% { transform: translateY(-6px) scale(1.06); filter: drop-shadow(0 0 14px #22c55e) brightness(1.25); }
      100% { transform: translateY(0) scale(1); filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4)); }
    }

    @keyframes unboostGlow {
      0% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 0px #ef4444); }
      50% { transform: translateY(4px) scale(0.95); filter: drop-shadow(0 0 14px #ef4444) brightness(0.85); }
      100% { transform: translateY(0) scale(1); filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4)); }
    }

    /* Caja de Diálogo y Eventos - Compacta y centrada */
    .dialog-box {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 12px;
      min-height: 48px;
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.35;
      display: flex;
      align-items: center;
      color: #e2e8f0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }

    /* Panel de Controles / Movimientos */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .moves-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 100%;
    }

    .btn-move {
      border: none;
      padding: 7px 9px;
      border-radius: 10px;
      color: white;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 52px;
      box-shadow: 0 3px 6px -1px rgba(0,0,0,0.3);
      transition: transform 0.1s ease, filter 0.15s ease;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    .btn-move:active {
      transform: scale(0.97);
    }

    .btn-move:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .move-header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px;
      width: 100%;
    }

    .move-name {
      font-weight: 800;
      font-size: 0.8rem;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .move-pp-badge {
      font-size: 0.64rem;
      font-weight: 700;
      opacity: 0.88;
      flex-shrink: 0;
    }

    .move-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.66rem;
      font-weight: 700;
      opacity: 0.95;
      width: 100%;
    }

    /* Acciones secundarias (Mega, Switch, Surrender) */
    .action-bar {
      display: flex;
      gap: 6px;
      margin-top: 1px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 38px;
      transition: background 0.15s ease;
      box-sizing: border-box;
    }

    /* Ajustes para pantallas con más espacio (tablets / desktop) */
    @media (min-width: 480px) {
      .sprite-container {
        width: 86px;
        height: 86px;
      }
      .poke-sprite {
        max-width: 82px;
        max-height: 82px;
      }
      .team-mini-slot {
        width: 30px;
        height: 30px;
        border-radius: 7px;
      }
      .team-mini-img {
        width: 26px;
        height: 26px;
      }
      .team-mini-img.pokeball-unrevealed {
        width: 18px;
        height: 18px;
      }
      .btn-move {
        min-height: 56px;
        padding: 8px 10px;
      }
    }
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-mega {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border: none;
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.4);
    }

    .btn-mega.active {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
    }

    /* Modal / Bottom Sheet para cambiar Pokémon */
    .bottom-sheet {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .bottom-sheet.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet-content {
      background: #1e293b;
      border-top: 1px solid var(--border-color);
      border-radius: 20px 20px 0 0;
      padding: 16px;
      max-height: 80vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .sheet-title {
      font-size: 1rem;
      font-weight: 800;
      color: white;
    }

    .btn-close-sheet {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .bench-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bench-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .bench-card:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .bench-card.fainted {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .bench-sprite {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .bench-details {
      flex: 1;
    }

    /* Modal Fin de Batalla */
    .end-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .end-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .end-card {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
    }

    .end-title {
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 10px;
    }
    .end-title.won { color: #22c55e; }
    .end-title.lost { color: #ef4444; }

    .btn-return {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 16px;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Header Fijo Superior -->
  <header class="battle-header">
    <button id="btn-exit" class="btn-back">← Salir</button>
    <div class="battle-title">
      <span>⚔️</span>
      <span id="txt-trainer-name">Entrenador Rival</span>
    </div>
    <div id="txt-turn" class="turn-badge">Turno 1</div>
  </header>

  <main class="battle-container">
    <!-- Escenario de Combate -->
    <section class="battle-arena">
      <!-- Indicadores globales de Clima / Terreno / Trick Room -->
      <div id="box-field-badges" class="field-badges-bar"></div>

      <!-- Zona del Rival (Arriba) -->
      <div class="side-zone ai-side">
        <div class="sprite-container">
          <img id="img-ai-sprite" class="poke-sprite" src="" alt="Rival">
        </div>
        <div class="poke-info-card">
          <div class="poke-header">
            <span id="txt-ai-name" class="poke-name">---</span>
            <span id="txt-ai-lvl" class="poke-level">Lv. 50</span>
          </div>
          <div id="box-ai-types" class="type-tags"></div>
          <div class="hp-bar-outer">
            <div id="bar-ai-hp" class="hp-bar-inner"></div>
          </div>
          <div class="hp-text">
            <span id="txt-ai-hp">100%</span>
            <span id="badge-ai-status"></span>
          </div>
          <div id="box-ai-meta" class="poke-meta-row"></div>
          <div id="box-ai-modifiers" class="modifiers-row"></div>
        </div>
      </div>

      <!-- Zona del Jugador (Abajo) -->
      <div class="side-zone player-side">
        <div class="sprite-container">
          <img id="img-player-sprite" class="poke-sprite" src="" alt="Jugador">
        </div>
        <div class="poke-info-card">
          <div class="poke-header">
            <span id="txt-player-name" class="poke-name">---</span>
            <span id="txt-player-lvl" class="poke-level">Lv. 50</span>
          </div>
          <div id="box-player-types" class="type-tags"></div>
          <div class="hp-bar-outer">
            <div id="bar-player-hp" class="hp-bar-inner"></div>
          </div>
          <div class="hp-text">
            <span id="txt-player-hp">--- / ---</span>
            <span id="badge-player-status"></span>
          </div>
          <div id="box-player-meta" class="poke-meta-row"></div>
          <div id="box-player-modifiers" class="modifiers-row"></div>
        </div>
      </div>

    </section>

    <!-- Caja de Diálogo / Narrador -->
    <div id="box-dialog" class="dialog-box">
      ¡Comienza el combate! Elige tu movimiento.
    </div>

    <!-- Panel de Controles -->
    <section class="controls-panel">
      <!-- 4 Movimientos en Grid 2x2 -->
      <div id="moves-grid" class="moves-grid"></div>

      <!-- Acciones de Soporte -->
      <div class="action-bar">
        <button id="btn-toggle-mega" class="btn-action btn-mega" style="display: none;">
          ⚡ Megaevolución
        </button>
        <button id="btn-open-switch" class="btn-action">
          🔄 Cambiar (Banca)
        </button>
        <button id="btn-surrender" class="btn-action" style="max-width: 90px; color: #f87171;">
          Rendirse
        </button>
      </div>

      <!-- Vista de Equipos 6v6 (Minisprites Jugador a la izquierda y Rival a la derecha) -->
      <div id="box-teams-overview" class="teams-overview-bar">
        <div class="team-minis-side player-team-minis">
          <span class="team-minis-label">Tu Equipo</span>
          <div id="team-icons-player" class="team-minis-row"></div>
        </div>
        <div class="team-minis-divider">VS</div>
        <div class="team-minis-side ai-team-minis">
          <span class="team-minis-label">Equipo Rival</span>
          <div id="team-icons-ai" class="team-minis-row"></div>
        </div>
      </div>

      <!-- Registro de Combate estilo Pokémon Showdown (Plegable en móvil) -->
      <details class="battle-log-details" id="details-battle-log">
        <summary class="battle-log-summary">📋 Registro de Combate (Toca para expandir)</summary>
        <div id="box-battle-log" class="battle-log-panel">
          <div class="log-turn-header">📋 Registro de Combate (Showdown Sim)</div>
        </div>
      </details>
    </section>
  </main>

  <!-- Bottom Sheet para Cambiar Pokémon -->
  <div id="sheet-switch" class="bottom-sheet">
    <div class="sheet-content">
      <div class="sheet-header">
        <span class="sheet-title">Seleccionar Pokémon de Banca</span>
        <button id="btn-close-sheet" class="btn-close-sheet">&times;</button>
      </div>
      <div id="box-bench-list" class="bench-list"></div>
    </div>
  </div>

  <!-- Modal Fin de Batalla -->
  <div id="modal-end" class="end-modal">
    <div class="end-card">
      <h2 id="end-title" class="end-title">¡VICTORIA!</h2>
      <p id="end-msg">Has derrotado al entrenador rival.</p>
      <button id="btn-modal-return" class="btn-return">Volver a la Subasta</button>
    </div>
  </div>

  <script src="config.js?v=20261111_sd5"></script>
  <script type="module" src="js/pve_battle_ui.js?v=20261111_sd5"></script>
</body>
</html>
